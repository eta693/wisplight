name: Build & GameTests

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Resolve versions
        id: versions
        run: |
          mkdir -p report
          NEO=$(grep '^neo_version=' gradle.properties | cut -d= -f2)
          MDG=$(grep '^moddev_version=' gradle.properties | cut -d= -f2)
          if [ "$NEO" = "latest" ]; then
            NEO=$(curl -fsSL https://maven.neoforged.net/releases/net/neoforged/neoforge/maven-metadata.xml \
              | grep -oE '<version>21\.1\.[0-9]+</version>' | sed -E 's#</?version>##g' | sort -V | tail -1)
          fi
          if [ "$MDG" = "latest" ]; then
            MDG=$(curl -fsSL https://maven.neoforged.net/releases/net/neoforged/moddev/net.neoforged.moddev.gradle.plugin/maven-metadata.xml \
              | grep -oE '<version>2\.0\.[0-9]+</version>' | sed -E 's#</?version>##g' | sort -V | tail -1)
          fi
          echo "neo=$NEO" >> "$GITHUB_OUTPUT"
          echo "mdg=$MDG" >> "$GITHUB_OUTPUT"
          printf 'neo_version=%s\nmoddev_version=%s\n' "$NEO" "$MDG" > report/versions.txt
          cat report/versions.txt

      - name: Asset check
        id: assets
        continue-on-error: true
        run: |
          set -o pipefail
          python3 tools/check_assets.py 2>&1 | tee report/assets.log

      - name: Build
        id: build
        continue-on-error: true
        run: |
          set -o pipefail
          chmod +x gradlew
          ./gradlew build --stacktrace \
            -Pneo_version=${{ steps.versions.outputs.neo }} \
            -Pmoddev_version=${{ steps.versions.outputs.mdg }} 2>&1 | tee report/build.log

      - name: GameTests
        id: gametest
        if: steps.build.outcome == 'success'
        continue-on-error: true
        run: |
          set -o pipefail
          timeout 1200 ./gradlew runGameTestServer \
            -Pneo_version=${{ steps.versions.outputs.neo }} \
            -Pmoddev_version=${{ steps.versions.outputs.mdg }} 2>&1 | tee report/gametest.log

      - name: Collect report
        if: always()
        run: |
          {
            echo "sha=${GITHUB_SHA}"
            echo "build=${{ steps.build.outcome }}"
            echo "gametest=${{ steps.gametest.outcome }}"
            echo "assets=${{ steps.assets.outcome }}"
          } > report/status.txt
          grep -nE 'error:|warning: \[|FAILED|Exception|Caused by' report/build.log > report/build-errors.txt 2>/dev/null || true
          grep -iE "wisplight" report/gametest.log | grep -iE "error|exception|invalid|couldn't|failed to|unknown" \
            | grep -v "GameTestHooks" > report/data-errors.txt 2>/dev/null || true
          echo "dataerrors=$(wc -l < report/data-errors.txt 2>/dev/null || echo 0)" >> report/status.txt
          cp build/libs/*.jar report/ 2>/dev/null || true
          cp -r build/test-results report/test-results 2>/dev/null || true
          if [ -d run ]; then
            find run -maxdepth 2 -name '*.log' -exec cp {} report/ \; 2>/dev/null || true
            find run -maxdepth 3 -name '*.xml' -path '*gametest*' -exec cp {} report/ \; 2>/dev/null || true
          fi
          ls -la report

      - name: Push report branch
        if: always()
        run: |
          cd report
          git init -q -b ci-report
          git add -A
          git -c user.name="wisplight-ci" -c user.email="ci@users.noreply.github.com" \
            commit -qm "CI ${GITHUB_SHA::7} build=${{ steps.build.outcome }} gametest=${{ steps.gametest.outcome }}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" ci-report

      - name: Upload jar
        if: steps.build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: wisplight-jar
          path: build/libs/*.jar

      - name: Fail if broken
        if: steps.build.outcome != 'success' || steps.gametest.outcome != 'success' || steps.assets.outcome != 'success'
        run: exit 1

  tour:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Install virtual display
        run: sudo apt-get update -qq && sudo apt-get install -y -qq xvfb libgl1-mesa-dri mesa-utils > /dev/null

      - name: Pre-generate world
        continue-on-error: true
        run: |
          chmod +x gradlew
          mkdir -p run-tour tour-report
          echo "eula=true" > run-tour/eula.txt
          cat > run-tour/server.properties <<'PROPS'
          online-mode=false
          level-name=world
          level-type=minecraft\:flat
          generator-settings={"layers":[{"block":"minecraft:bedrock","height":1},{"block":"minecraft:stone","height":60},{"block":"minecraft:dirt","height":3},{"block":"minecraft:grass_block","height":1}],"biome":"minecraft:plains"}
          gamemode=creative
          spawn-protection=0
          spawn-monsters=false
          allow-flight=true
          PROPS
          timeout 900 ./gradlew runTourPregen 2>&1 | tail -40 | tee tour-report/pregen.log

      - name: Run client tour
        continue-on-error: true
        run: |
          mkdir -p run-tour-client/saves
          cp -r run-tour/world run-tour-client/saves/tour
          cat > run-tour-client/options.txt <<'OPTS'
          onboardAccessibility:false
          skipMultiplayerWarning:true
          joinedFirstServer:true
          pauseOnLostFocus:false
          tutorialStep:none
          narrator:0
          renderDistance:8
          simulationDistance:8
          gamma:1.0
          guiScale:2
          soundCategory_master:0.0
          lang:fr_fr
          OPTS
          export LIBGL_ALWAYS_SOFTWARE=1
          timeout 1500 xvfb-run -a -s "-screen 0 1280x720x24" ./gradlew runTourClient 2>&1 | tail -150 > tour-report/client.log || true
          cp run-tour-client/screenshots/*.png tour-report/ 2>/dev/null || true
          cp run-tour-client/logs/latest.log tour-report/client-full.log 2>/dev/null || true
          grep -E "ERROR|Exception|Visite" run-tour-client/logs/latest.log | grep -v "ALSA\|OpenAL\|SoundSystem" > tour-report/client-errors.log 2>/dev/null || true
          ls -la tour-report

      - name: Push tour report
        if: always()
        run: |
          cd tour-report
          git init -q -b ci-tour
          git add -A
          git -c user.name="wisplight-ci" -c user.email="ci@users.noreply.github.com" commit -qm "Tour ${GITHUB_SHA::7}" || true
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" ci-tour
