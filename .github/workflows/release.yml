name: Release

# Publie (ou met à jour) la release correspondant à mod_version à chaque push sur main.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: true

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Build
        id: build
        run: |
          chmod +x gradlew
          ./gradlew build -x test
          echo "version=$(grep '^mod_version=' gradle.properties | cut -d= -f2)" >> "$GITHUB_OUTPUT"

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.build.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: Wisplight ${{ steps.build.outputs.version }}
          files: build/libs/*.jar
          make_latest: true
          body: |
            Mod Minecraft **Java 1.21.1** pour **NeoForge** (21.1.266 ou plus récent).

            **Installation** : dépose le fichier `.jar` dans le dossier `mods` de ton instance NeoForge 1.21.1.

            Contenu : 4 feux follets, bocaux et essences, lumen (outils et armure), autel d'infusion et 16 infusions,
            charmes, bâtons, Ombres rampantes, Armure du Veilleur, Sanctuaire oublié, le Veilleur Éteint (boss en 3 phases),
            grimoire et 15 succès. Français et anglais.
