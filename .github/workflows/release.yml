name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew build

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          name: Wisplight ${{ github.ref_name }}
          files: build/libs/*.jar
          body: |
            Mod Minecraft Java 1.21.1 pour NeoForge (21.1.266 ou plus récent).

            Installation : dépose le fichier `.jar` dans le dossier `mods` de ton instance NeoForge 1.21.1.
